services:

  web:

    build: .

    container_name: rails_web

    command: bin/rails server -b 0.0.0.0

    volumes:

      - .:/usr/src/app

      - bundle:/usr/local/bundle

    ports:

      - "3000:3000"

    environment:

      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

    stdin_open: true

    tty: true


  redis:

    image: redis:7

    ports:

      - "6379:6379"


volumes:

  bundle: